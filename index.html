<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)">
<script>window.PWA_MODE = true;</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
.lock-b{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lock-b img{border-radius:20px;box-shadow:var(--shadow)}
.lock-b h2{margin:6px 0 0;font-size:22px;font-weight:600}
.lock-b p{margin:0 0 8px;color:var(--muted)}
</style>
</head>
<body>
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: one calm centred column (max 34rem), floating tab bar with a raised centre "+", bottom sheets for every input. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --fg:#18201B; --muted:#69716B; --faint:#9AA19B; --line:#E2E5E0;
  --accent:#2F5D4A; --accent-2:#DCE7E0; --on-accent:#FFFFFF; --bar:#D5DCD7;
  --ok:#2F7A55; --warn:#A06C0E; --bad:#B4483A;
  --shadow:0 1px 2px rgba(20,30,24,.04),0 10px 30px rgba(20,30,24,.06);
  --scrim:rgba(16,22,18,.32);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --g-liq:#3F7A62; --g-vor:#7A6FA8; --g-anl:#B7894F;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#171C19; --surface-2:#222924; --fg:#E9EEEA; --muted:#98A29B; --faint:#6A746D; --line:#283029;
  --accent:#8FC2A6; --accent-2:#1F2E26; --on-accent:#0D1511; --bar:#2E3832;
  --ok:#7CC79F; --warn:#E0B65E; --bad:#EE8B7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#171C19; --surface-2:#222924; --fg:#E9EEEA; --muted:#98A29B; --faint:#6A746D; --line:#283029;
  --accent:#8FC2A6; --accent-2:#1F2E26; --on-accent:#0D1511; --bar:#2E3832;
  --ok:#7CC79F; --warn:#E0B65E; --bad:#EE8B7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.55); color-scheme:dark}
:root.force-light{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEEA; --fg:#18201B; --muted:#69716B; --faint:#9AA19B; --line:#E2E5E0;
  --accent:#2F5D4A; --accent-2:#DCE7E0; --on-accent:#FFFFFF; --bar:#D5DCD7;
  --ok:#2F7A55; --warn:#A06C0E; --bad:#B4483A; --shadow:0 1px 2px rgba(20,30,24,.04),0 10px 30px rgba(20,30,24,.06); --scrim:rgba(16,22,18,.32); color-scheme:light}
:root.force-dark{
  --bg:#0F1311; --surface:#171C19; --surface-2:#222924; --fg:#E9EEEA; --muted:#98A29B; --faint:#6A746D; --line:#283029;
  --accent:#8FC2A6; --accent-2:#1F2E26; --on-accent:#0D1511; --bar:#2E3832;
  --ok:#7CC79F; --warn:#E0B65E; --bad:#EE8B7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.amt{font-variant-numeric:tabular-nums}
.i{flex:none;display:block}

#app{max-width:34rem;margin:0 auto;padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.hdr h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hdr h1 span{color:var(--faint);font-weight:400}
.hdr .back{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:500;margin-left:-6px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);box-shadow:var(--shadow)}
.iconbtn:active{transform:scale(.95)}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2{font-size:15px;font-weight:600;margin:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.link{color:var(--accent);font-weight:500;font-size:14px;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}

/* hero */
.hero{padding:24px 22px 22px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:46px;font-weight:300;letter-spacing:-.035em;line-height:1.05;margin:2px 0 10px}
.hero .big small{font-size:18px;font-weight:400;color:var(--muted);letter-spacing:0;margin-right:6px}
.meter{position:relative;height:10px;border-radius:99px;background:var(--surface-2);overflow:visible}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.meter>i.warn{background:var(--warn)} .meter>i.bad{background:var(--bad)}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--fg);opacity:.35}
.meter-l{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.duo>div{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.duo .v{font-size:17px;font-weight:500;margin-top:2px}
.lbl{font-size:12px;color:var(--muted)}

.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--accent-2);color:var(--fg);width:100%}
.banner .i{color:var(--accent)}
.banner strong{font-weight:600}
.banner .grow{flex:1;min-width:0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;white-space:nowrap}
.chip.plain{padding:7px 13px;box-shadow:none;background:var(--surface-2)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip:active{transform:scale(.97)}
.chip .x{opacity:.6}

/* bubble icons */
.bub{flex:none;display:grid;place-items:center;border-radius:50%;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}

/* transactions */
.txs{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;border-radius:14px}
.tx:hover{background:var(--surface-2)}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-a{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.tx-a.income{color:var(--ok)} .tx-a.transfer{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 4px;font-size:13px;color:var(--muted);font-weight:500}
.day-h:first-child{padding-top:0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .i{color:var(--faint)}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);text-align:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-row .t{font-weight:600;text-align:center;flex:1;min-width:0}
.nav-row .iconbtn{box-shadow:none;background:transparent}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.stats .v{font-size:19px;font-weight:500;letter-spacing:-.01em;margin-top:2px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r{font-variant-numeric:tabular-nums;font-weight:500;text-align:right;white-space:nowrap}
.row.total{font-weight:600}

.cbars{display:flex;flex-direction:column;gap:12px}
.cbar{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;width:100%}
.cbar .n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .v{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.cbar .track{grid-column:2/4;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cbar .track i{display:block;height:100%;border-radius:99px;background:var(--c)}
.cbar .bub{grid-row:1/3}
.cbar .p{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:10px;fill:var(--muted)}
.chart .bar{fill:var(--bar);cursor:pointer;transition:fill .2s}
.chart .bar.hi{fill:var(--accent)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart-cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13px;color:var(--muted)}
.chart-cap strong{color:var(--fg);font-weight:500;font-size:15px}

/* search */
.searchbar{display:flex;gap:8px}
.field-s{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);min-width:0}
.field-s input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.field-s .i{color:var(--faint)}
.fbtn{position:relative;width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}
.fbtn.on{background:var(--fg);color:var(--bg)}

/* list menu */
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.mi{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi:hover{background:var(--surface-2)}
.mi .grow{flex:1;min-width:0}
.mi .sub{font-size:13px;color:var(--muted)}
.mi .chev{color:var(--faint)}
.mi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.sec-t{font-size:13px;font-weight:500;color:var(--muted);margin:6px 4px -10px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:26rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--faint);font-weight:500}
.tab.on{color:var(--fg)}
.fab{justify-self:center;width:56px;height:56px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:600;background:var(--surface-2);color:var(--fg);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:14px}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center}
.ov.open{opacity:1}
.sheet{width:100%;max-width:34rem;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ov.open .sheet{transform:none}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:28px;max-height:88%;padding-bottom:20px}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh-h h3{margin:0;font-size:18px;font-weight:600}
.sh-b{display:flex;flex-direction:column;gap:16px}

/* entry */
.amount{text-align:center;padding:6px 0 2px}
.amount .v{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.amount .v small{font-size:20px;color:var(--muted);font-weight:400;letter-spacing:0;margin-right:6px}
.amount .v.zero{color:var(--faint)}
.amount .v.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;font-size:12px;text-align:center;line-height:1.2;color:var(--muted);min-width:0;border:1.5px solid transparent}
.cat span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on{background:var(--surface);color:var(--fg);border-color:var(--fg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:54px;border-radius:16px;background:var(--surface);font-size:22px;font-weight:400;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.key:active{background:var(--surface-2);transform:scale(.97)}
.more-t{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;padding:4px}
.hint{text-align:center;font-size:13px;color:var(--bad);min-height:1em}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-size:13px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 13px;outline:none;min-width:0;appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;width:100%}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--muted);border:1.5px solid transparent}
.pick.on{border-color:var(--fg);color:var(--fg)}
.swatch{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1.5px transparent}
.swatch.on{box-shadow:0 0 0 2px var(--fg)}

/* pending */
.pend{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}
.pend .grow{flex:1;min-width:0}

/* dialog + toast */
.dlg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:24px}
.dlg-b{background:var(--surface);border-radius:24px;padding:22px;max-width:22rem;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.dlg-b p{margin:0}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:var(--fg);color:var(--bg);padding:11px 12px 11px 18px;border-radius:16px;display:flex;align-items:center;gap:14px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--bg);opacity:.75;font-weight:600;padding:4px 6px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.soon{display:flex;gap:8px;flex-wrap:wrap}
.desc-wrap{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.inp.desc{text-align:center;border-color:transparent;background:var(--surface-2);border-radius:14px}
.inp.desc:focus{border-color:var(--accent);background:var(--surface)}
#eSug:empty{display:none}
.ins{padding:16px 18px}
.ins-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:14px}
.ins-row b{font-weight:600}

const PALETTE = ['#6F8F72','#B9845A','#C0705F','#6584A8','#9878A8','#4F958C','#BE9A45','#B4687F','#6E7E90','#8E7B66','#5F9467','#8A8F98'];
const FREQ = { monthly:{m:1,l:'Monatlich'}, quarterly:{m:3,l:'Quartalsweise'}, semiannual:{m:6,l:'Halbjährlich'}, yearly:{m:12,l:'Jährlich'} };
const FALLBACK = { expense:'sonstiges', income:'sonstige-einnahmen' };
function defaultConfig() {
  const categories = {};
  [['wohnen','Wohnen','home',3,true],['lebensmittel','Lebensmittel','cart',0,false],['restaurants','Restaurants & Cafés','coffee',1,false],
   ['freizeit','Freizeit','ticket',4,false],['shopping','Shopping','bag',7,false],['mobilitaet','Mobilität','train',8,false],
   ['reisen','Reisen','plane',5,false],['gesundheit','Gesundheit','heart',2,false],['versicherungen','Versicherungen','shield',9,true],
   ['abonnemente','Abonnemente','repeat',4,true],['bildung','Bildung','book',6,false],['sonstiges','Sonstiges','dots',11,false]]
  .forEach(([id, name, ic, ci, fixed], i) => categories[id] = { id, name, icon: ic, color: PALETTE[ci], kind: 'expense', subs: [], fixed, order: i });
  categories.ausgang = AUSGANG();
  [['lohn','Lohn','briefcase',10],['nebenverdienst','Nebenverdienst','coin',5],['rueckerstattungen','Rückerstattungen','refund',3],['sonstige-einnahmen','Sonstige Einnahmen','dots',11]]
  .forEach(([id, name, ic, ci], i) => categories[id] = { id, name, icon: ic, color: PALETTE[ci], kind: 'income', subs: [], fixed: false, order: 100 + i });
  return {
    settings: { defaultBudget: 0, theme: 'system', defaultAccount: 'privat', version: 1, mig: { ausgang: 1 } },
    categories,

      spar: { id: 'spar', name: 'Sparkonto', kind: 'spar', opening: 0, order: 1 },
      bar: { id: 'bar', name: 'Bargeld', kind: 'bar', opening: 0, order: 2 },

  };
}

/* ================= Persistence =================
   Documents: "config" (settings, categories, accounts, budgets, favorites, rules)
   and one "tx-YYYY-MM" per month ({items:{id: tx | null}}). null = deleted.
   Sync backend: Claude db, private per user (data/users/<id>/...). Fallback: localStorage. */
const LS = 'rappen-budget-v1';
let docs = {};
const S = { settings: {}, budgets: {}, categories: {}, accounts: {}, favorites: {}, rules: {}, goals: {}, closings: {}, tx: {} };
let backend = 'local', col = null, synced = false, dlApi = null, startCache = null, syncError = false;
const Q = {};

function merge(t, p) {
  for (const k in p) {
    const v = p[k];
    if (isObj(v)) { if (!isObj(t[k])) t[k] = {}; merge(t[k], v); }
    else t[k] = Array.isArray(v) ? v.slice() : v;
  }

}
const live = o => { const r = {}; for (const k in (o || {})) if (o[k] != null) r[k] = o[k]; return r; };

function derive() {
  const c = docs.config || {};
  S.settings = Object.assign({ defaultBudget: 0, theme: 'system', defaultAccount: 'privat' }, live(c.settings));
  S.budgets = live(c.budgets); S.categories = live(c.categories); S.accounts = live(c.accounts);
  S.favorites = live(c.favorites); S.rules = live(c.rules); S.goals = live(c.goals); S.closings = live(c.closings);
  S.tx = {};
  for (const id in docs) if (id.startsWith('tx-')) { const it = docs[id].items || {}; for (const k in it) if (it[k]) S.tx[k] = it[k]; }
  S.refunds = {};
  for (const t of Object.values(S.tx)) if (t.type === 'income' && t.refOf && S.tx[t.refOf] && S.tx[t.refOf].type === 'expense') S.refunds[t.refOf] = (S.refunds[t.refOf] || 0) + t.amount;
  applyTheme();
}
function saveCache() { try { localStorage.setItem(LS, JSON.stringify({ origin: backend, docs })); } catch (e) {} }
function loadCache() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }

function patch(id, p) {
  docs[id] = merge(docs[id] || {}, clone(p));
  if (backend === 'sync') {
    const q = Q[id] || (Q[id] = { pending: null, inflight: null });
    q.pending = merge(q.pending || {}, clone(p));
    flush(id);
  } else if (backend === 'supa') supaTouch(id, p);
  derive(); saveCache(); schedule();
}
async function writeDoc(ref, p) {
  try { await ref.update(p); }
  catch (e) {
    if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (!s.exists) return ref.set(p); throw e; }
    if (e && e.code === 'unavailable') { await sleep(600 + Math.random() * 900); return writeDoc2(ref, p); }
    throw e;
  }
}
async function writeDoc2(ref, p) {
  try { await ref.update(p); }
  catch (e) { if (e && e.code === 'invalid_argument') { const s = await ref.get(); if (!s.exists) return ref.set(p); } throw e; }
}
async function flush(id) {
  const q = Q[id];
  if (!q || !synced || q.inflight || !q.pending) return;
  q.inflight = q.pending; q.pending = null;
  try { await writeDoc(col.doc(id), q.inflight); syncError = false; }
  catch (e) {
    syncError = true;
    toast(e && e.code === 'quota_exceeded' ? 'Speicher voll – bitte Backup erstellen' : 'Synchronisation fehlgeschlagen – Eintrag nur lokal');
  }

}
function onSnap(snap) {
  if (snap.metadata.fromCache && snap.empty) return;
  const nd = {};
  snap.docs.forEach(d => { if (d.exists) nd[d.id] = clone(d.data()); });
  for (const id in Q) {
    const q = Q[id];
    if (q.inflight) nd[id] = merge(nd[id] || {}, clone(q.inflight));
    if (q.pending) nd[id] = merge(nd[id] || {}, clone(q.pending));

  if (sheetKind === 'pending') refreshSheet();
  if (!snap.metadata.fromCache && !synced) afterSync();
}
function afterSync() {
  if (synced) return;
  synced = true;
  if (!docs.config || !docs.config.categories) {
    const local = startCache && startCache.origin === 'local' && startCache.docs && startCache.docs.config ? startCache.docs : null;
    if (local) { for (const id in local) patch(id, local[id]); toast('Lokale Daten übernommen und synchronisiert'); }
    else patch('config', merge(defaultConfig(), (Q.config && Q.config.pending) || {}));
  }
  for (const id in Q) flush(id);

  schedule();
}
async function checkSync() {
  if (synced || !col) return;
  try {
    const snap = await col.get();
    if (synced) return;
    const nd = {}; snap.docs.forEach(d => { if (d.exists) nd[d.id] = clone(d.data()); });
    for (const id in Q) { const q = Q[id]; if (q.pending) nd[id] = merge(nd[id] || {}, clone(q.pending)); }
    docs = nd; derive(); afterSync();
  } catch (e) { syncError = true; schedule(); }
}

async function boot() {
  if (window.PWA_MODE) return bootPwa();
  startCache = loadCache();
  if (startCache && startCache.docs) docs = startCache.docs;
  if (!docs.config || !docs.config.categories) docs.config = defaultConfig();
  derive(); render();
  let dbx = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [dbx, user, dlApi] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
    }
  } catch (e) {}
  let id = null;
  try { id = user ? await user.id() : null; } catch (e) {}
  if (dbx && id) {
    try {
      col = dbx.collection('data/users/' + id);
      backend = 'sync';
      col.onSnapshot(onSnap, () => { syncError = true; schedule(); });
      setTimeout(checkSync, 7000);
    } catch (e) { backend = 'local'; col = null; }
  }
  if (backend === 'local') { saveCache(); startup(); }
  render();
}

<script>
/* ================= Domain ================= */
const catOf = id => S.categories[id] || { id, name: 'Ohne Kategorie', icon: 'dots', color: '#8A8F98' };
const accName = id => { const a = S.accounts[id]; return a ? a.name + (a.inst ? ' ' + a.inst : '') : '—'; };
const defAcc = () => S.accounts[S.settings.defaultAccount] ? S.settings.defaultAccount : (accountsSorted()[0] || {}).id || null;
const accountsSorted = () => Object.values(S.accounts).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, 'de'));
const catsOf = kind => Object.values(S.categories).filter(c => c.kind === kind).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, 'de'));
function catsByUsage(kind) {
  const since = addDays(today(), -120), cnt = {};
  for (const t of Object.values(S.tx)) if (t.date >= since && t.catId) cnt[t.catId] = (cnt[t.catId] || 0) + 1;
  return catsOf(kind).map((c, i) => ({ c, i, n: cnt[c.id] || 0 })).sort((a, b) => b.n - a.n || a.i - b.i).map(x => x.c);
}
const budgetFor = mk => S.budgets[mk] != null ? S.budgets[mk] : (S.settings.defaultBudget || 0);
const txSorted = list => list.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
const txIn = (a, b) => Object.values(S.tx).filter(t => t.date >= a && t.date <= b);

function sum(list) {
  const r = { exp: 0, inc: 0, fix: 0, vari: 0, byCat: {}, n: 0 };
  for (const t of list) {
    if (t.type === 'expense') { const a = Math.max(0, t.amount - ((S.refunds || {})[t.id] || 0)); r.exp += a; if (t.fixed) r.fix += a; else r.vari += a; r.byCat[t.catId] = (r.byCat[t.catId] || 0) + a; r.n++; }
    else if (t.type === 'income') { if (t.refOf && S.tx[t.refOf] && S.tx[t.refOf].type === 'expense') continue; r.inc += t.amount; r.n++; }
  }
  return r;
}
function putTx(t, old) {
  if (old && mkey(old.date) !== mkey(t.date)) patch('tx-' + mkey(old.date), { items: { [old.id]: null } });
  patch('tx-' + mkey(t.date), { items: { [t.id]: t } });
}
function delTx(t) {
  patch('tx-' + mkey(t.date), { items: { [t.id]: null } });
  if (t.recur && S.rules[t.recur]) patch('config', { rules: { [t.recur]: { skips: { [t.date]: 1 } } } });
}

/* Recurring */
function occurrences(r, from, to) {
  const out = [], per = FREQ[r.freq] ? FREQ[r.freq].m : 1, day = +r.start.slice(8);
  for (let k = 0, d = r.start; d <= to && k < 1200; k++, d = addMonths(r.start, k * per, day)) {
    if (r.end && d > r.end) break;
    if (d >= from) out.push(d);
  }
  return out;
}
function pendingList() {
  const t = today(), out = [];
  for (const r of Object.values(S.rules)) {
    if (!r.active || !r.start) continue;
    const from = r.since && r.since > r.start ? r.since : r.start;
    for (const d of occurrences(r, from, t)) {
      const id = `r-${r.id}-${d}`;
      if (!S.tx[id] && !(r.skips || {})[d]) out.push({ r, d, id });
    }
  }
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function upcomingList(days = 45) {
  const t = today(), out = [];
  for (const r of Object.values(S.rules)) if (r.active && r.start) for (const d of occurrences(r, addDays(t, 1), addDays(t, days))) out.push({ r, d });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
const monthlyEq = r => Math.round(r.amount / (FREQ[r.freq] ? FREQ[r.freq].m : 1));
function fixedPlan() {
  let exp = 0, inc = 0;
  for (const r of Object.values(S.rules)) if (r.active) { if (r.type === 'income') inc += monthlyEq(r); else exp += monthlyEq(r); }
  return { exp, inc };
}
function nextDue(r) { const o = occurrences(r, today(), addMonths(today(), 13)); return o[0] || null; }
function bookOcc(o) {
  const r = o.r;
  putTx({ id: o.id, type: r.type === 'income' ? 'income' : 'expense', amount: r.amount, date: o.d, catId: r.catId, sub: null,
    accountId: S.accounts[r.accountId] ? r.accountId : defAcc(), toAccountId: null, desc: r.name, note: null,
    fixed: r.type !== 'income', recur: r.id, createdAt: Date.now(), updatedAt: Date.now() });
}
const skipOcc = o => patch('config', { rules: { [o.r.id]: { skips: { [o.d]: 1 } } } });

/* Accounts & wealth.
   Each account may carry value anchors vals[date] = {v, at}: "the balance was v at the end of the update".
   Balance = latest anchor (or opening) + every booking on that account made after the anchor. */
const GROUPS = [['liquid', 'Liquidität'], ['vorsorge', 'Vorsorge'], ['anlagen', 'Anlagen']];
const KINDS = { liquid: { privat: 'Privatkonto', spar: 'Sparkonto', bar: 'Bargeld', karte: 'Karte' },
  vorsorge: { '3a': 'Säule 3a', fz: 'Freizügigkeit / PK' }, anlagen: { depot: 'Wertschriften / ETF', krypto: 'Krypto', anlage: 'Andere Anlage' } };
const LIQUID = KINDS.liquid, INVEST = Object.assign({}, KINDS.vorsorge, KINDS.anlagen);
const groupOf = a => KINDS.vorsorge[a.kind] ? 'vorsorge' : KINDS.anlagen[a.kind] ? 'anlagen' : 'liquid';
const GCOL = { liquid: 'var(--g-liq)', vorsorge: 'var(--g-vor)', anlagen: 'var(--g-anl)' };
const isInvest = a => !!(a && INVEST[a.kind]);
const kindLabel = a => INVEST[a.kind] || LIQUID[a.kind] || 'Konto';
const INST_COLORS = ['#3F7A62', '#5B7FB0', '#A2714F', '#7A6FA8', '#3F8C8E', '#A55A70', '#7C8742'];
function instColor(n) { let h = 0; for (const ch of n.toUpperCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return INST_COLORS[h % INST_COLORS.length]; }
const instBadge = (n, s = 36) => n
  ? `<span class="inst" style="--c:${instColor(n)};width:${s}px;height:${s}px;font-size:${Math.round(s * (n.length > 3 ? .27 : .32))}px">${esc(n.slice(0, 4).toUpperCase())}</span>`
  : `<span class="inst" style="--c:var(--muted);width:${s}px;height:${s}px">${icon('wallet', Math.round(s * .46))}</span>`;
const fmt0 = v => 'CHF ' + fmt(Math.round(v / 100) * 100, { cur: false, short: true });
function anchors(a) {
  const v = a.vals || {}, out = [];
  for (const d in v) if (v[d] && v[d].v != null) out.push({ d, v: v[d].v, at: v[d].at || 0 });
  return out.sort((x, y) => x.d.localeCompare(y.d) || x.at - y.at);
}
const lastVal = a => { const l = anchors(a); return l.length ? l[l.length - 1] : null; };
const afterAnchor = (l, t) => !l || t.date > l.d || (t.date === l.d && (t.createdAt || 0) > l.at);
function delta(t, id) {
  if (t.type === 'expense') return t.accountId === id ? -t.amount : 0;
  if (t.type === 'income') return t.accountId === id ? t.amount : 0;
  if (t.type === 'transfer') return (t.toAccountId === id ? t.amount : 0) - (t.accountId === id ? t.amount : 0);
  return 0;
}
function balances() {
  const b = {}, anc = {};
  for (const a of Object.values(S.accounts)) { const l = lastVal(a); anc[a.id] = l; b[a.id] = l ? l.v : (a.opening || 0); }
  for (const t of Object.values(S.tx)) for (const id of new Set([t.accountId, t.toAccountId])) {
    if (id && b[id] != null && afterAnchor(anc[id], t)) b[id] += delta(t, id);
  }
  return b;
}
function wealth() {
  const b = balances(), g = { liquid: 0, vorsorge: 0, anlagen: 0 }, stale = [];
  for (const a of Object.values(S.accounts)) {
    g[groupOf(a)] += b[a.id];
    if (isInvest(a)) { const l = lastVal(a); if (!l || l.d < addDays(today(), -60)) stale.push(a); }
  }
  return { b, g, total: g.liquid + g.vorsorge + g.anlagen, stale };
}
function valHistory(a) {
  const list = anchors(a), tx = Object.values(S.tx).filter(t => t.accountId === a.id || t.toAccountId === a.id);
  return list.map((cur, i) => {
    if (!i) return Object.assign({ market: null, flows: null }, cur);
    const prev = list[i - 1];
    const flows = tx.filter(t => afterAnchor(prev, t) && !afterAnchor(cur, t)).reduce((s, t) => s + delta(t, a.id), 0);
    return Object.assign({ market: cur.v - (prev.v + flows), flows, base: prev.v + flows }, cur);
  });
}
function forecast(mk) {
  const [a, b] = monthRange(mk), t = today(), [y, m] = mk.split('-').map(Number), n = dim(y, m);
  const st = sum(txIn(a, b)), B = budgetFor(mk);
  const cur = mkey(t) === mk, day = cur ? +t.slice(8) : (mk < mkey(t) ? n : 0);
  const avg = day ? Math.round(st.vari / day) : 0;
  const proj = cur ? st.vari + avg * (n - day) : st.vari;
  const remDays = cur ? n - day + 1 : 0;
  const rem = B - st.vari;
  return { st, B, n, day, avg, proj, remDays, rem, perDay: remDays && rem > 0 ? Math.floor(rem / remDays) : 0, dev: B - proj, cur };
}

/* ================= UI state ================= */
const ui = { tab: 'home', mode: 'month', anchor: today(), from: addDays(today(), -29), to: today(), q: '', f: {}, sel: null,
  finMonth: mkey(today()), set: null, catKind: 'expense', showW: false };
let renderQueued = false;
function schedule() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

/* ================= Shared bits ================= */
const bubble = (c, s = 40) => `<span class="bub" style="--c:${esc(c.color)};width:${s}px;height:${s}px">${icon(c.icon, Math.round(s * .5))}</span>`;
const TRANSFER_CAT = { icon: 'swap', color: '#7D8A99', name: 'Übertrag' };
function txRow(t, showDate) {
  const c = t.type === 'transfer' ? TRANSFER_CAT : catOf(t.catId);
  const title = t.desc || (t.type === 'transfer' ? `${accName(t.accountId)} → ${accName(t.toAccountId)}` : c.name);
  const subParts = t.type === 'transfer' ? ['Übertrag'] : [t.desc ? c.name : null, t.sub, Object.keys(S.accounts).length > 1 && t.accountId !== defAcc() ? accName(t.accountId) : null];
  if (showDate) subParts.unshift(relDay(t.date));
  const sub = subParts.filter(Boolean).join(' · ') || (t.type === 'income' ? 'Einnahme' : '');
  const a = t.type === 'expense' ? fmt(-t.amount, { cur: false }) : t.type === 'income' ? fmt(t.amount, { sign: true, cur: false }) : fmt(t.amount, { cur: false });
  return `<button class="tx" data-a="edit-tx" data-id="${esc(t.id)}">${bubble(c, 40)}<span class="tx-main"><span class="tx-t">${esc(title)}</span><span class="tx-s">${esc(sub)}${t.fixed ? ' <span class="pill">Fix</span>' : ''}${(S.refunds || {})[t.id] ? ` <span class="pill ok">${fmt(S.refunds[t.id], { cur: false })} erstattet</span>` : ''}${t.refOf && S.tx[t.refOf] ? ' <span class="pill">Rückerstattung</span>' : ''}${t.tax ? ' <span class="pill">Steuer</span>' : ''}</span></span><span class="tx-a ${t.type}">${a}</span></button>`;
}
function txGrouped(list) {
  if (!list.length) return `<div class="empty">${icon('list', 28)}<div>Keine Buchungen in diesem Zeitraum.</div></div>`;
  const groups = {}; txSorted(list).forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  return `<div class="txs">${Object.keys(groups).map(d => {
    const s = sum(groups[d]);
    return `<div class="day-h"><span>${relDay(d)}</span><span class="num">${s.exp ? fmt(-s.exp) : ''}</span></div>${groups[d].map(t => txRow(t)).join('')}`;
  }).join('')}</div>`;
}
function catBars(byCat, total, clickable = true) {
  const e = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!e.length) return `<div class="muted small">Noch keine Ausgaben.</div>`;
  return `<div class="cbars">${e.map(([id, v]) => {
    const c = catOf(id), p = total ? Math.round(v / total * 100) : 0;
    return `<${clickable ? `button data-a="filter-cat" data-id="${esc(id)}"` : 'div'} class="cbar">${bubble(c, 34)}<span class="n">${esc(c.name)}<span class="p">${p} %</span></span><span class="v">${fmt(v, { cur: false })}</span><span class="track"><i style="width:${Math.max(2, p)}%;--c:${esc(c.color)}"></i></span></${clickable ? 'button' : 'div'}>`;
  }).join('')}</div>`;
}
function barChart(vals, labels, hi, key) {
  const W = 320, H = 150, pt = 14, pb = 22, n = vals.length, max = Math.max(...vals, 1), bw = W / n, ih = H - pt - pb;
  const sel = ui.sel && ui.sel.k === key ? ui.sel.i : hi;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ausgaben je Periode">`;
  s += `<line class="grid" x1="0" x2="${W}" y1="${H - pb + .5}" y2="${H - pb + .5}"/><line class="grid" x1="0" x2="${W}" y1="${pt + .5}" y2="${pt + .5}" stroke-dasharray="2 4"/>`;
  vals.forEach((v, i) => {
    const h = v > 0 ? Math.max(3, v / max * ih) : 0, x = i * bw + bw * .2, w = bw * .6;

function period() {

  if (ui.mode === 'day') return { a, b: a, label: relDay(a) };
  if (ui.mode === 'week') { const wd = (pd(a).getDay() + 6) % 7, s = addDays(a, -wd), e = addDays(s, 6); return { a: s, b: e, label: `KW ${isoWeek(s)} · ${fdshort(s)}–${fdshort(e)}` }; }
  if (ui.mode === 'month') { const [s, e] = monthRange(mkey(a)); return { a: s, b: e, label: monthLabel(mkey(a)) }; }
  if (ui.mode === 'year') { const y = a.slice(0, 4); return { a: `${y}-01-01`, b: `${y}-12-31`, label: y }; }
  const s = ui.from <= ui.to ? ui.from : ui.to, e = ui.from <= ui.to ? ui.to : ui.from;
  return { a: s, b: e, label: `${fdate(s)} – ${fdate(e)}` };
}
function shiftPeriod(dir) {

  ui.sel = null;
}
function matches(t) {
  const f = ui.f, q = ui.q.trim().toLowerCase();
  if (f.type && t.type !== f.type) return false;
  if (f.cat && t.catId !== f.cat) return false;
  if (f.sub && t.sub !== f.sub) return false;
  if (f.fixed === 'fix' && !(t.type === 'expense' && t.fixed)) return false;
  if (f.fixed === 'var' && !(t.type === 'expense' && !t.fixed)) return false;
  if (f.acc && t.accountId !== f.acc && t.toAccountId !== f.acc) return false;
  if (f.min != null && t.amount < f.min) return false;
  if (f.max != null && t.amount > f.max) return false;
  if (q) {
    const hay = [t.desc, t.note, t.sub, t.catId ? catOf(t.catId).name : 'umbuchung', fmt(t.amount, { cur: false }).replace(/’/g, '')].join(' ').toLowerCase();
    if (!hay.includes(q.replace(/’|'/g, ''))) return false;

  return true;
}
const activeFilters = () => Object.entries(ui.f).filter(([, v]) => v != null && v !== '');
function filterChips() {

}
function catAnalysis(catId, endDate) {
  const c = catOf(catId), endMk = mkey(endDate), vals = [], labels = [];

    labels.push(MSHORT[+mk.slice(5) - 1]);

  const ch = barChart(vals, labels, 5, 'cat');

function splitBar(parts) {
  const tot = parts.reduce((s, p) => s + Math.max(0, p.v), 0);
  if (tot <= 0) return '';
  const vis = parts.filter(p => p.v > 0);
  return `<div class="split3">${vis.map(p => `<i style="flex:${p.v};background:${p.c}" title="${esc(p.l)}"></i>`).join('')}</div>
    <div class="legend">${vis.map(p => `<span><i class="gdot" style="background:${p.c}"></i>${esc(p.l)} <b class="num">${Math.round(p.v / tot * 100)} %</b></span>`).join('')}</div>`;
}

<script>
/* ================= Merchants (learned from history) ================= */
function merchantIndex() {

    const e = m[k] || (m[k] = { name: t.desc.trim(), type: t.type, n: 0, cats: {}, last: '' });
    e.n++; if (t.catId) e.cats[t.catId] = (e.cats[t.catId] || 0) + 1; if (t.date > e.last) e.last = t.date;
  }
  for (const k in m) { const c = Object.entries(m[k].cats).sort((a, b) => b[1] - a[1])[0]; m[k].catId = c && S.categories[c[0]] ? c[0] : null; }
  return m;
}
function merchantSuggest(q, type) {
  q = (q || '').trim().toLowerCase(); if (q.length < 1) return [];
  return Object.values(merchantIndex()).filter(e => e.type === type && e.name.toLowerCase().includes(q) && e.name.toLowerCase() !== q)
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || b.n - a.n || b.last.localeCompare(a.last)).slice(0, 4);
}

/* ================= Insights ================= */
function insights() {

  if (inc) out.push({ ic: catOf(inc.catId).icon, tone: 'ok', html: `${esc(inc.desc || catOf(inc.catId).name)} eingegangen: <b class="num">${fmt(inc.amount)}</b>` });
  const monthTx = txIn(ma, mb);
  for (const c of catsOf('expense')) if (c.limit > 0) {
    const sp = sum(monthTx.filter(x => x.catId === c.id)).exp, p = sp / c.limit;
    if (p >= 1) out.push({ ic: c.icon, tone: 'bad', html: `${esc(c.name)}: Limit um <b class="num">${fmt(sp - c.limit)}</b> überschritten` });
    else if (p >= .85) out.push({ ic: c.icon, tone: 'warn', html: `${esc(c.name)}: <b>${Math.round(p * 100)} %</b> vom Limit ${fmt(c.limit, { short: true })} erreicht` });
  }

  if (up) out.push({ ic: 'bell', tone: '', html: `${up.d === addDays(t, 1) ? 'Morgen' : 'Übermorgen'} fällig: <b>${esc(up.r.name)}</b> <span class="num">${fmt(up.r.amount)}</span>` });
  if (day >= 5) {
    const pmk = mkey(addMonths(ma, -1)), [py, pm] = pmk.split('-').map(Number), pEnd = `${pmk}-${pad(Math.min(day, dim(py, pm)))}`;
    const cur = sum(txIn(ma, t).filter(x => !x.fixed)).byCat, prev = sum(txIn(`${pmk}-01`, pEnd).filter(x => !x.fixed)).byCat;
    let best = null;
    for (const id of new Set([...Object.keys(cur), ...Object.keys(prev)])) {

  }
  return out.slice(0, 3);
}
function insightsCard() {

/* ================= Savings goals ================= */
const goalsSorted = () => Object.values(S.goals || {}).sort((a, b) => (a.created || 0) - (b.created || 0));
function monthsUntil(d) { const [y1, m1] = today().split('-').map(Number), [y2, m2] = d.split('-').map(Number); return Math.max(1, (y2 - y1) * 12 + (m2 - m1)); }

  const moves = Object.values(g.moves || {}).filter(Boolean).sort((a, b) => b.d.localeCompare(a.d) || (b.at || 0) - (a.at || 0));
  const saved = moves.reduce((s, m) => s + m.v, 0), rem = Math.max(0, g.target - saved), pct = g.target ? Math.min(1, Math.max(0, saved / g.target)) : 0;
  const req = g.date && rem > 0 ? Math.ceil(rem / monthsUntil(g.date)) : null;
  const eta = g.monthly > 0 && rem > 0 ? addMonths(today().slice(0, 8) + '01', Math.ceil(rem / g.monthly)) : null;

<script>
/* ================= PWA: Supabase sync, app lock, files ================= */
const SBK = 'finance-sb', OUTK = 'finance-outbox', PULLK = 'finance-lastpull', LOCKK = 'finance-lock';
const SB = { url: '', key: '', session: null, lastSync: null };
let outbox = {}, outSeq = Date.now(), supaState = 'off', supaErr = '', flushing = false, flushT = null, pulling = false;

function sbLoad() { try { Object.assign(SB, JSON.parse(localStorage.getItem(SBK) || '{}')); outbox = JSON.parse(localStorage.getItem(OUTK) || '{}'); } catch (e) {} }
function sbSave() { try { localStorage.setItem(SBK, JSON.stringify({ url: SB.url, key: SB.key, session: SB.session, lastSync: SB.lastSync })); } catch (e) {} }
function outSave() { try { localStorage.setItem(OUTK, JSON.stringify(outbox)); } catch (e) {} }

async function sbFetch(path, opts = {}, auth = true) {
  if (auth) await ensureToken();
  const h = Object.assign({ apikey: SB.key, 'Content-Type': 'application/json' }, opts.headers || {});
  h.Authorization = 'Bearer ' + (auth && SB.session ? SB.session.access_token : SB.key);
  const r = await fetch(SB.url.replace(/\/+$/, '') + path, Object.assign({}, opts, { headers: h }));
  if (!r.ok) {
    let m = ''; try { const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || ''; } catch (e) {}
    const err = new Error(m || ('HTTP ' + r.status)); err.status = r.status; throw err;
  }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
function setSession(j) {
  SB.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: { id: j.user.id, email: j.user.email } };
  sbSave();
}
async function ensureToken() {
  if (!SB.session) throw new Error('Nicht angemeldet');
  if (Date.now() < SB.session.expires_at - 60000) return;
  const j = await sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: SB.session.refresh_token }) }, false);
  setSession(j);
}
const splitKey = k => { const a = k.split('/'); return [a[0], a[1], a.slice(2).join('/')]; };

function supaTouch(id, p) {
  for (const k1 in p) { const v1 = p[k1]; if (isObj(v1)) for (const k2 in v1) outbox[`${id}/${k1}/${k2}`] = ++outSeq; }
  outSave(); scheduleFlush();
}
function scheduleFlush() { clearTimeout(flushT); flushT = setTimeout(supaFlush, 500); }
async function supaFlush() {
  if (flushing || !SB.session || !navigator.onLine) { if (!navigator.onLine && SB.session) supaState = 'offline'; return; }
  const keys = Object.keys(outbox); if (!keys.length) return;
  flushing = true;
  try {
    for (let i = 0; i < keys.length; i += 200) {
      const chunk = keys.slice(i, i + 200), seqs = chunk.map(k => outbox[k]);
      const rows = chunk.map(k => { const [d, k1, k2] = splitKey(k); const v = docs[d] && isObj(docs[d][k1]) ? docs[d][k1][k2] : null; return { k, v: v === undefined ? null : v }; });
      await sbFetch('/rest/v1/items?on_conflict=user_id,k', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
      chunk.forEach((k, j) => { if (outbox[k] === seqs[j]) delete outbox[k]; });
      outSave();
    }
    supaState = 'online'; supaErr = ''; SB.lastSync = Date.now(); sbSave();
  } catch (e) { supaState = navigator.onLine ? 'error' : 'offline'; supaErr = e.message || ''; }
  finally { flushing = false; schedule(); if (Object.keys(outbox).length && supaState === 'online') scheduleFlush(); }
}
async function supaPull(full) {
  if (pulling || !SB.session || !navigator.onLine) return null;
  pulling = true;
  try {
    const since = full ? null : localStorage.getItem(PULLK);
    let rows = [], from = 0; const page = 1000;
    for (;;) {
      const q = `/rest/v1/items?select=k,v,updated_at&order=updated_at.asc${since ? '&updated_at=gt.' + encodeURIComponent(since) : ''}`;
      const r = await sbFetch(q, { headers: { Range: `${from}-${from + page - 1}`, 'Range-Unit': 'items' } }) || [];
      rows = rows.concat(r); if (r.length < page) break; from += page;
    }
    let max = since;
    for (const row of rows) {
      if (!max || row.updated_at > max) max = row.updated_at;
      if (outbox[row.k]) continue;
      const [d, k1, k2] = splitKey(row.k);
      docs[d] = docs[d] || {}; if (!isObj(docs[d][k1])) docs[d][k1] = {};
      docs[d][k1][k2] = row.v;
    }
    if (max) localStorage.setItem(PULLK, new Date(new Date(max).getTime() - 2000).toISOString());
    if (rows.length) { derive(); saveCache(); schedule(); }
    supaState = 'online'; supaErr = ''; SB.lastSync = Date.now(); sbSave();
    return new Set(rows.map(r => r.k));
  } catch (e) { supaState = navigator.onLine ? 'error' : 'offline'; supaErr = e.message || ''; schedule(); return null; }
  finally { pulling = false; }
}
async function supaConnect() {
  localStorage.removeItem(PULLK);
  const remote = await supaPull(true);
  if (!remote) return false;
  for (const d in docs) for (const k1 in docs[d]) if (isObj(docs[d][k1])) for (const k2 in docs[d][k1]) {
    const k = `${d}/${k1}/${k2}`; if (!remote.has(k)) outbox[k] = ++outSeq;
  }
  outSave(); await supaFlush(); return true;
}
async function supaWipe() {
  if (!SB.session) return;
  try { await sbFetch('/rest/v1/items?k=not.is.null', { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); } catch (e) {}
  outbox = {}; outSave(); localStorage.removeItem(PULLK);
}
function syncNow() { supaFlush().then(() => supaPull(false)).then(() => { schedule(); if (ui.set === 'sync') render(); }); }

async function bootPwa() {
  pwaActions(); sbLoad();
  startCache = loadCache();
  const hadCache = !!(startCache && startCache.docs && startCache.docs.config && startCache.docs.config.categories);
  if (hadCache) docs = startCache.docs;
  else docs = { config: defaultConfig() };
  backend = SB.session ? 'supa' : 'local';
  derive(); render(); showLockIfNeeded(true);
  if (backend === 'supa') {
    supaState = navigator.onLine ? 'online' : 'offline';
    if (!hadCache || !localStorage.getItem(PULLK)) await supaConnect();
    else { await supaFlush(); await supaPull(false); }
  }
  synced = true; startup(); saveCache(); render();
  setInterval(() => { if (!document.hidden && backend === 'supa') syncNow(); }, 30000);
  window.addEventListener('online', () => { if (backend === 'supa') syncNow(); });
  window.addEventListener('offline', () => { if (backend === 'supa') { supaState = 'offline'; schedule(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && backend === 'supa') syncNow(); });
  registerSW();
}
async function supaLogin(signup) {
  const url = ($('#sbUrl') || {}).value, key = ($('#sbKey') || {}).value, email = ($('#sbMail') || {}).value, pw = ($('#sbPw') || {}).value;
  const h = $('#syncHint'), say = m => { if (h) h.textContent = m; };
  if (url) SB.url = url.trim(); if (key) SB.key = key.trim();
  if (!/^https:\/\/.+/.test(SB.url) || !SB.key) return say('Projekt-URL und Key aus Supabase eintragen.');
  if (!email || !pw || pw.length < 8) return say('E-Mail und Passwort (mind. 8 Zeichen) eingeben.');
  sbSave(); say(signup ? 'Konto wird erstellt …' : 'Anmeldung …');
  try {
    if (signup) {
      const j = await sbFetch('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email: email.trim(), password: pw }) }, false);
      if (!(j && j.access_token)) return say('Konto erstellt. Bestätige den Link in deiner E-Mail und melde dich danach hier an.');
      setSession(j);
    } else {
      setSession(await sbFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: email.trim(), password: pw }) }, false));
    }
    backend = 'supa'; say('Synchronisiere …');
    await supaConnect(); startup(); render(); toast('Sync aktiv');
  } catch (e) { say(e.status === 400 ? 'Anmeldung fehlgeschlagen – E-Mail oder Passwort prüfen (oder E-Mail noch nicht bestätigt).' : 'Fehler: ' + (e.message || 'Verbindung nicht möglich')); }
}
function supaLogout() {
  confirmDlg('Abmelden?<br><span class="small muted">Die Daten bleiben auf diesem Gerät und in deiner Datenbank. Neue Änderungen werden erst nach erneuter Anmeldung übertragen.</span>', 'Abmelden', () => {
    SB.session = null; sbSave(); backend = 'local'; supaState = 'off'; render();
  }, false);
}

/* ---------- Sync & security page ---------- */
function vSync() {
  const pend = Object.keys(outbox).length, lk = lockCfg(), wa = !!window.PublicKeyCredential;
  const st = !SB.session ? '<span class="dot warn"></span>Nicht verbunden – Daten nur auf diesem Gerät'
    : supaState === 'offline' ? `<span class="dot warn"></span>Offline${pend ? ` · ${pend} Änderungen warten` : ''}`
    : supaState === 'error' ? `<span class="dot warn"></span>Sync-Fehler: ${esc(supaErr)}`
    : `<span class="dot ok"></span>Synchronisiert${SB.lastSync ? ' · ' + new Date(SB.lastSync).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : ''}`;
  return `<div class="view">${backHdr('Sync & Sicherheit', 'set-back')}
    <section class="card form"><div class="status">${st}</div>
      ${SB.session ? `<div class="rows"><div class="row"><span class="muted">Konto</span><span class="r" style="white-space:normal">${esc(SB.session.user.email)}</span></div></div>
        <div class="btns"><button class="btn" data-a="sync-out">Abmelden</button><button class="btn pri" data-a="sync-now">Synchronisieren</button></div>`
      : `<p class="small muted" style="margin:0">Verbinde deine eigene, kostenlose Supabase-Datenbank, damit iPhone und Mac dieselben Daten haben. Offline erfasste Einträge werden automatisch nachgeliefert.</p>
        <div class="fld"><label for="sbUrl">Projekt-URL</label><input class="inp" id="sbUrl" value="${esc(SB.url)}" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off"></div>
        <div class="fld"><label for="sbKey">Publishable / anon Key</label><input class="inp" id="sbKey" value="${esc(SB.key)}" placeholder="sb_publishable_… oder eyJ…" autocomplete="off" autocapitalize="off"></div>
        <div class="fld"><label for="sbMail">E-Mail</label><input class="inp" id="sbMail" type="email" autocomplete="username" autocapitalize="off"></div>
        <div class="fld"><label for="sbPw">Passwort</label><input class="inp" id="sbPw" type="password" autocomplete="current-password"></div>
        <div class="hint" id="syncHint" style="color:var(--muted)"></div>
        <div class="btns"><button class="btn" data-a="sync-signup">Konto erstellen</button><button class="btn pri" data-a="sync-login">Anmelden</button></div>`}
    </section>
    <div class="sec-t">Sicherheit</div>
    <section class="card form">
      ${wa ? `<button class="toggle" data-a="lock-toggle"><span>Mit Face ID / Touch ID sperren<br><span class="small muted">Beim Öffnen und nach 5 Minuten im Hintergrund</span></span><span class="sw ${lk ? 'on' : ''}"></span></button>`
        : '<p class="small muted" style="margin:0">Face ID ist in diesem Browser nicht verfügbar.</p>'}
      <p class="small faint" style="margin:0">Die Sperre schützt die Anzeige auf diesem Gerät. Deine Datenbank ist zusätzlich durch Login und Zugriffsregeln geschützt.</p>
    </section>
  </div>`;
}

/* ---------- App lock (WebAuthn platform authenticator) ---------- */
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function lockCfg() { try { return JSON.parse(localStorage.getItem(LOCKK) || 'null'); } catch (e) { return null; } }
async function toggleLock() {
  if (lockCfg()) { localStorage.removeItem(LOCKK); toast('Sperre deaktiviert'); render(); return; }
  try {
    const cred = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'Finance' }, user: { id: rnd(16), name: 'Finance', displayName: 'Finance' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
    localStorage.setItem(LOCKK, JSON.stringify({ id: b64(cred.rawId) })); toast('Face ID aktiviert'); render();
  } catch (e) { toast('Face ID konnte nicht eingerichtet werden'); }
}
let hiddenAt = 0, locked = false;
function showLockIfNeeded(force) {
  const c = lockCfg(); if (!c) return;
  if (!force && Date.now() - hiddenAt < 5 * 60000) return;
  locked = true; const el = $('#lock'); el.hidden = false; $('#app').setAttribute('aria-hidden', 'true');
  setTimeout(tryUnlock, 350);
}
async function tryUnlock() {
  const c = lockCfg(); if (!c) return hideLock();
  try {
    await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(c.id) }], userVerification: 'required', timeout: 60000 } });
    hideLock();
  } catch (e) { const m = $('#lockMsg'); if (m) m.textContent = 'Tippe zum Entsperren'; }
}
function hideLock() { locked = false; $('#lock').hidden = true; $('#app').removeAttribute('aria-hidden'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else if (!locked) showLockIfNeeded(false); });

/* ---------- Files & service worker ---------- */
async function pwaSave(filename, data) {
  const type = filename.endsWith('.pdf') ? 'application/pdf' : filename.endsWith('.csv') ? 'text/csv' : 'application/json';
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Datei gespeichert');
}
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) { nw.postMessage('skip'); toast('Update installiert – beim nächsten Öffnen aktiv'); } });
    });
  }).catch(() => {});
}
function pwaActions() { Object.assign(actions, {
  'sync-login': () => supaLogin(false), 'sync-signup': () => supaLogin(true), 'sync-now': () => { syncNow(); toast('Synchronisiere …'); },
  'sync-out': () => supaLogout(), 'lock-toggle': () => toggleLock(), 'lock-unlock': () => tryUnlock(),
}); }

<script>
/* ================= Events ================= */
const actions = {
  tab: el => { ui.tab = el.dataset.v; if (ui.tab !== 'set') ui.set = null; render(); window.scrollTo(0, 0); },

  close: () => closeSheet(),

  'cat-kind': el => { ui.catKind = el.dataset.v; render(); },
  'new-cat': () => openCat(null), 'edit-cat': el => openCat(el.dataset.id),
  'save-cat': () => saveCat(), 'del-cat': () => deleteCat(F.id),
  'f-set': el => { F[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'type') { F.catId = F.type === 'income' ? 'lohn' : 'abonnemente'; if (!F.id) { F.auto = F.type === 'income'; if (!F.name) F.name = F.type === 'income' ? 'Lohn' : ''; } } refreshSheet(); },
  'f-toggle': el => { F[el.dataset.k] = !F[el.dataset.k]; refreshSheet(); },
  'f-sub-add': () => { const v = (F.subIn || '').trim(); if (v && !F.subs.includes(v)) F.subs.push(v); F.subIn = ''; refreshSheet(); const i = $('#cSub'); if (i) i.focus(); },
  'f-sub-del': el => { F.subs.splice(+el.dataset.i, 1); refreshSheet(); },
  'new-rule': () => openRule(null), 'edit-rule': el => openRule(el.dataset.id),
  'save-rule': () => saveRule(),
  'del-rule': () => { const id = F.id, name = F.name; confirmDlg(`«${esc(name)}» löschen?<br><span class="small muted">Bereits gebuchte Zahlungen bleiben erhalten.</span>`, 'Löschen', () => { patch('config', { rules: { [id]: null } }); closeSheet(); toast('Gelöscht'); }); },
  'new-acc': () => openAcc(null), 'edit-acc': el => openAcc(el.dataset.id),
  'new-invest': el => openAcc(null, el.dataset.v === 'liquid' ? 'privat' : el.dataset.v === 'vorsorge' ? '3a' : 'depot'),
  'w-view': el => { ui.wView = el.dataset.v; render(); },
  'val-acc': el => openVal(el.dataset.id), 'save-val': () => saveVal(),
  'wealth-toggle': () => { ui.showW = !ui.showW; render(); },
  'wealth-details': () => { ui.tab = 'wealth'; render(); window.scrollTo(0, 0); },
  'save-acc': () => saveAcc(), 'del-acc': () => deleteAcc(F.id),
  'add-transfer': () => openEntry({ type: 'transfer' }),
  'new-fav': () => openFav(null), 'edit-fav': el => openFav(el.dataset.id),
  'save-fav': () => saveFav(),
  'del-fav': () => { const id = F.id; patch('config', { favorites: { [id]: null } }); closeSheet(); toast('Favorit gelöscht'); },
  'export-csv': () => exportCsv(),
  'tax-open': () => openTax(), 'tax-y': el => { F.y = String(+F.y + +el.dataset.v); ui.taxYear = F.y; refreshSheet(); }, 'tax-pdf': () => taxPdf(),
  'tax-max': () => { F.editMax = !F.editMax; refreshSheet(); },
  'tax-max-save': () => { const v = parseMoney(F.max); if (!(v > 0)) return hint('Betrag prüfen'); patch('config', { settings: { max3a: v } }); F.editMax = false; refreshSheet(); },
  'cal-day': el => { ui.mode = 'day'; ui.anchor = el.dataset.v; render(); window.scrollTo(0, 0); },
  review: el => openReview(+el.dataset.v),
  'add-refund': () => { const o = E.orig; closeSheet(); setTimeout(() => openEntry({ type: 'income', refOf: o.id, catId: 'rueckerstattungen', desc: 'Rückerstattung ' + (o.desc || catOf(o.catId).name) }), 260); },
  'toggle-goals': () => patch('config', { settings: { showGoals: !S.settings.showGoals } }),
  'e-sug': el => { E.desc = el.dataset.name; if (el.dataset.cat) { E.catId = el.dataset.cat; E.sub = ''; if (!E.ft) E.fixed = !!(S.categories[E.catId] || {}).fixed; if (!E.taxT) E.tax = (S.categories[E.catId] || {}).tax || ''; } refreshSheet(); },
  'goal-new': () => openGoalEdit(null), 'goal-edit': el => openGoalEdit(el.dataset.id), 'goal-save': () => saveGoal(),
  'goal-open': el => openGoal(el.dataset.id),
  'goal-mode': el => { F.mode = el.dataset.v || null; F.amt = ''; refreshSheet(); if (F.mode) setTimeout(() => { const i = $('#mAmt'); if (i) i.focus(); }, 50); },
  'goal-move': () => saveMove(),
  'goal-move-del': el => { const gid = F.gid, mid = el.dataset.id, g = S.goals[gid], old = g && g.moves && g.moves[mid]; patch('config', { goals: { [gid]: { moves: { [mid]: null } } } }); if (old && old.src === 'budget') { const mk = mid.replace('close-', ''); patch('config', { closings: { [mk]: null } }); } refreshSheet(); toast('Eintrag gelöscht', () => { patch('config', { goals: { [gid]: { moves: { [mid]: old } } } }); if (old && old.src === 'budget') patch('config', { closings: { [mid.replace('close-', '')]: { goalId: gid, v: old.v, at: Date.now() } } }); if (sheetKind === 'goal') refreshSheet(); }); },
  'goal-del': () => { const id = F.id, name = F.name; confirmDlg(`Sparziel «${esc(name)}» löschen?`, 'Löschen', () => { patch('config', { goals: { [id]: null } }); closeSheet(); toast('Sparziel gelöscht'); }); },
  closing: el => openClosing(el.dataset.v), 'close-assign': () => assignClosing(),
  'w-pt': el => { ui.wSel = +el.dataset.i; render(); },
  statement: () => openStatement(), 'st-pdf': () => statementPdf(), 'st-csv': () => statementCsv(),
  pie: el => { ui.pie = ui.pie === el.dataset.id ? null : el.dataset.id; render(); },
  'pie-scope': el => { ui.pieScope = el.dataset.v; ui.pie = null; render(); }, 'export-json': () => exportJson(),
  import: () => $('#importFile').click(),
  wipe: () => confirmDlg('Alle Buchungen, Kategorien, Konten und Einstellungen endgültig löschen?<br><span class="small muted">Erstelle vorher ein Backup, falls du die Daten noch brauchst.</span>', 'Alles löschen', () => wipeAll()),
  'dlg-no': () => { $('#dlg').hidden = true; dlgFn = null; },
  'dlg-yes': () => { $('#dlg').hidden = true; const f = dlgFn; dlgFn = null; if (f) f(); },
};
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  if (e.target.id === 'dlg') { $('#dlg').hidden = true; dlgFn = null; return; }
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = actions[el.dataset.a]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.e && E) { E[t.dataset.e] = t.value; if (t.id === 'eDesc') onDescInput(); if (t.id === 'eTax') E.taxT = true; return; }
  if (t.dataset.ff && F) { F[t.dataset.ff] = t.value; if (t.dataset.re && t.tagName !== 'SELECT') { if (sheetKind === 'rule') { const st = $('#sheetBody').scrollTop; refreshSheet(); const n = document.getElementById(t.id); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } $('#sheetBody').scrollTop = st; } } return; }
  if (t.dataset.bind) { ui[t.dataset.bind] = t.value; if (t.dataset.bind !== 'q' && !t.value) return; schedule(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ff && F) { F[t.dataset.ff] = t.value; if (t.dataset.re) { if (t.dataset.ff === 'cat') F.sub = ''; refreshSheet(); } }
  if (t.dataset.e && E) E[t.dataset.e] = t.value;
});
$('#toastUndo').addEventListener('click', () => { const f = undoFn; undoFn = null; $('#toast').classList.remove('show'); if (f) { f(); toast('Rückgängig gemacht'); } });
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.readAsText(f); e.target.value = '';
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName || '', typing = /INPUT|TEXTAREA|SELECT/.test(tag);
  if (e.key === 'Escape') { if (!$('#dlg').hidden) { $('#dlg').hidden = true; dlgFn = null; } else if (sheetRender) closeSheet(); return; }
  if (sheetKind === 'entry') {
    if (e.key === 'Enter' && tag !== 'TEXTAREA' && tag !== 'BUTTON') { e.preventDefault(); saveEntry(); return; }
    if (typing || e.metaKey || e.ctrlKey) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); }
    else if (e.key === '.' || e.key === ',') { e.preventDefault(); pressKey('.'); }
    else if (e.key === 'Backspace') { e.preventDefault(); pressKey('del'); }
    return;
  }
  if (sheetKind === 'cat' && e.key === 'Enter' && e.target.id === 'cSub') { e.preventDefault(); actions['f-sub-add'](); return; }
  if (!sheetRender && !typing && !e.metaKey && !e.ctrlKey && (e.key === '+' || e.key === 'n')) { e.preventDefault(); openEntry(); }
});
/* Day change while open: re-render at midnight / when returning to the app */
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); ui.anchor = today(); ui.finMonth = mkey(today()); startup(); schedule(); } });

boot();
</script>
</body></html>
